<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>URL Redirect Checker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
    }

    .container {
      width: 90%;
      max-width: 650px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    p {
      color: #666;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #result {
      display: none;
      margin-top: 25px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 8px;
      word-break: break-all;
    }

    .error {
      color: #c00;
    }

    .success {
      color: #087a29;
    }

    .url {
      margin-top: 8px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>URL Redirect Checker</h1>

    <p>
      Entre une URL pour connaître son URL finale.
    </p>

    <input
      id="url"
      type="url"
      placeholder="https://example.com"
      autocomplete="off"
    >

    <button id="check">
      Vérifier l'URL
    </button>

    <div id="result"></div>

  </div>

<script>
  const input = document.getElementById("url");
  const button = document.getElementById("check");
  const result = document.getElementById("result");

  button.addEventListener("click", checkUrl);

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      checkUrl();
    }
  });

  async function checkUrl() {
    const target = input.value.trim();

    result.style.display = "none";
    result.innerHTML = "";

    if (!target) {
      showError("Veuillez entrer une URL.");
      return;
    }

    try {
      new URL(target);
    } catch {
      showError("L'URL n'est pas valide.");
      return;
    }

    button.disabled = true;
    button.textContent = "Vérification...";

    try {
      const apiUrl =
        "/api/redirect?url=" +
        encodeURIComponent(target);

      const response = await fetch(apiUrl);

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error || "Erreur inconnue"
        );
      }

      result.style.display = "block";
      result.innerHTML = `
        <div class="success">
          ✓ URL finale trouvée
        </div>

        <div style="margin-top:15px;">
          <strong>URL originale :</strong>
          <div class="url">${escapeHtml(data.originalUrl)}</div>
        </div>

        <div style="margin-top:15px;">
          <strong>URL finale :</strong>
          <div class="url">${escapeHtml(data.finalUrl)}</div>
        </div>

        <div style="margin-top:15px;">
          <strong>Status HTTP :</strong>
          ${data.status}
        </div>
      `;

    } catch (error) {
      showError(error.message);
    } finally {
      button.disabled = false;
      button.textContent = "Vérifier l'URL";
    }
  }

  function showError(message) {
    result.style.display = "block";
    result.innerHTML =
      '<div class="error">✕ ' +
      escapeHtml(message) +
      '</div>';
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
